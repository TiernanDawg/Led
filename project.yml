name: MiniMap
options:
  bundleIdPrefix: com.tiernan
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
targets:
  MiniMap:
    type: application
    platform: iOS
    sources:
      - path: OpenRoadDrive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiernan.minimap
        PRODUCT_NAME: MiniMap
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MiniMap
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "MiniMap uses your location to show where you are and calculate driving routes."
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
